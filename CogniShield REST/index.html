<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Secure Blog 前端</title>
    <!-- 引入 AWS Amplify CDN -->
    <script src="https://cdn.jsdelivr.net/npm/aws-amplify@latest/dist/aws-amplify.min.js"></script>
</head>
<body style="font-family: sans-serif; text-align: center; margin-top: 50px;">
    <h1>AWS 企業級資安 API 測試</h1>
    <div id="auth-status">尚未登入</div>
    <br>
    <button id="login-btn" onclick="login()" style="padding: 10px 20px; font-size: 16px;">登入 / 註冊</button>
    <br><br>
    <button onclick="fetchApi()" style="padding: 10px 20px; font-size: 16px; background-color: #4CAF50; color: white;">呼叫受保護的 API (GET /posts)</button>

    <pre id="result" style="margin: 20px auto; width: 60%; text-align: left; background: #f4f4f4; padding: 15px; border-radius: 5px;"></pre>

    <script>
        const awsConfig = {
            Auth: {
                region: 'us-east-1',
                userPoolId: 'us-east-1_Aio7dISnt',
                userPoolWebClientId: '4egojc3n5175bds8obmk0n902p',
                oauth: {
                    domain: 'us-east-1aio7disnt.auth.us-east-1.amazoncognito.com',
                    redirectSignIn: 'https://d3brrqmtmdy5wo.cloudfront.net/',
                    redirectSignOut: 'https://d3brrqmtmdy5wo.cloudfront.net/',
                    responseType: 'token'
                }
            }
        };

        // 初始化 Amplify
        aws_amplify.Amplify.configure(awsConfig);

        function login() {
            try {
                aws_amplify.Auth.federatedSignIn();
            } catch (err) {
                console.error("登入跳轉失敗: ", err);
                alert("登入觸發失敗: " + err);
            }
        }

        async function fetchApi() {
            try {
                const session = await aws_amplify.Auth.currentSession();
                const idToken = session.getIdToken().getJwtToken();

                document.getElementById('result').innerText = "正在使用 ID Token 呼叫 API...";

                const response = await fetch('https://v4m3faa2z7.execute-api.us-east-1.amazonaws.com/dev/posts', {
                    method: 'GET',
                    headers: { 
                        'Authorization': `Bearer ${idToken}` 
                    }
                });

                if (!response.ok) {
                    throw new Error(`API 請求失敗，HTTP 狀態碼: ${response.status}`);
                }

                const data = await response.json();
                document.getElementById('result').innerText = "API 呼叫成功！回傳結果：\n" + JSON.stringify(data, null, 2);

            } catch (err) {
                document.getElementById('result').innerText = "錯誤發生: " + err.message;
            }
        }
    </script>
</body>
</html>
